<svg xmlns="http://www.w3.org/2000/svg" width="960" height="840" viewBox="0 0 960 840" role="img" aria-labelledby="title desc"><title id="title">Escenarios ponderados por Consultora Diagonales</title><desc id="desc">Integración 63%, competencia interna 17,5%, ruptura 19,5%. Modelo analítico, no encuesta.</desc><rect width="960" height="840" fill="#f8fbfd"/><rect x="0" y="0" width="960" height="8" fill="#009AFE"/><g font-family="Arial,Helvetica,sans-serif" fill="#092743"><text x="48" y="65" font-size="31" font-weight="700">2027 · LOS ESCENARIOS DE LA CONSULTORA</text><text x="48" y="110" font-size="24" >Mapa de poder 2027 · Corte al 31 de octubre de 2026</text><text x="48" y="214" font-size="27" font-weight="700">Integración</text><rect x="48" y="239" width="730" height="28" fill="#e6edf4"/><rect x="48" y="239" width="459.9" height="28" fill="#003A90"/><text x="892" y="265" font-size="29" text-anchor="end" font-weight="700">63%</text><text x="48" y="349" font-size="27" font-weight="700">Competencia interna</text><rect x="48" y="374" width="730" height="28" fill="#e6edf4"/><rect x="48" y="374" width="127.75" height="28" fill="#157A9E"/><text x="892" y="400" font-size="29" text-anchor="end" font-weight="700">17,5%</text><text x="48" y="484" font-size="27" font-weight="700">Ruptura</text><rect x="48" y="509" width="730" height="28" fill="#e6edf4"/><rect x="48" y="509" width="142.35" height="28" fill="#C1432A"/><text x="892" y="535" font-size="29" text-anchor="end" font-weight="700">19,5%</text><text x="48" y="644" font-size="28" font-weight="700">Permanencia en el espacio: 80,5%</text><text x="48" y="686" font-size="24" >Integración + competencia interna. Ruptura: 19,5%.</text><text x="48" y="746" font-size="22" >Fuente: Consultora Diagonales · Modelo analítico, no encuesta.</text><text x="48" y="787" font-size="21" >Las ponderaciones no son probabilidades estadísticas validadas.</text></g><path d="M958 8V838H0" stroke="#009AFE" stroke-width="4" fill="none"/></svg>