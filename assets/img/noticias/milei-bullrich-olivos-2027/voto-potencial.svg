<svg xmlns="http://www.w3.org/2000/svg" width="960" height="840" viewBox="0 0 960 840" role="img" aria-labelledby="title desc"><title id="title">Bullrich y Milei: voto potencial y voto seguro</title><desc id="desc">Escala común de 0 a 100 por ciento. Potencial no equivale a intención de voto excluyente.</desc><rect width="960" height="840" fill="#f8fbfd"/><rect x="0" y="0" width="960" height="8" fill="#009AFE"/><g font-family="Arial,Helvetica,sans-serif" fill="#092743"><text x="48" y="65" font-size="32" font-weight="700">VOTO POTENCIAL Y VOTO SEGURO</text><text x="48" y="108" font-size="24" >Dos medidas distintas · Zuban Córdoba · Octubre 2026</text><text x="48" y="190" font-size="26" font-weight="700">Bullrich · Potencial</text><rect x="48" y="212" width="730" height="28" fill="#e6edf4"/><rect x="48" y="212" width="305.87" height="28" fill="#009AFE"/><text x="892" y="238" font-size="28" text-anchor="end" font-weight="700">41,9%</text><text x="48" y="301" font-size="26" font-weight="700">Milei · Potencial</text><rect x="48" y="323" width="730" height="28" fill="#e6edf4"/><rect x="48" y="323" width="271.56000000000006" height="28" fill="#009AFE"/><text x="892" y="349" font-size="28" text-anchor="end" font-weight="700">37,2%</text><text x="48" y="412" font-size="26" font-weight="700">Bullrich · Seguro</text><rect x="48" y="434" width="730" height="28" fill="#e6edf4"/><rect x="48" y="434" width="127.75" height="28" fill="#003A90"/><text x="892" y="460" font-size="28" text-anchor="end" font-weight="700">17,5%</text><text x="48" y="523" font-size="26" font-weight="700">Milei · Seguro</text><rect x="48" y="545" width="730" height="28" fill="#e6edf4"/><rect x="48" y="545" width="190.53" height="28" fill="#003A90"/><text x="892" y="571" font-size="28" text-anchor="end" font-weight="700">26,1%</text><text x="48" y="644" font-size="20" text-anchor="middle">0%</text><text x="230.5" y="644" font-size="20" text-anchor="middle">25%</text><text x="413" y="644" font-size="20" text-anchor="middle">50%</text><text x="595.5" y="644" font-size="20" text-anchor="middle">75%</text><text x="778" y="644" font-size="20" text-anchor="middle">100%</text><text x="48" y="699" font-size="22" >Potencial = voto seguro + voto posible. No equivale a una elección.</text><text x="48" y="742" font-size="22" >Campo: 16–19/10/2026 · 1.600 casos nacionales.</text><text x="48" y="781" font-size="21" >Fuente: Zuban Córdoba, según Hoy Día Córdoba (27/10/2026).</text></g><path d="M958 8V838H0" stroke="#009AFE" stroke-width="4" fill="none"/></svg>