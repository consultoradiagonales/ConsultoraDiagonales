<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Acceso a radiograf&iacute;as PDF de Consultora Diagonales." />
    <title>Acceso a radiograf&iacute;as | Consultora Diagonales</title>
    <link rel="stylesheet" href="../assets/css/style.css?v=20260701-private-request-channel" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>
  <body class="bg-[#080d14] text-white antialiased" data-page="registro">
    <header class="site-header is-solid" data-header>
      <a class="brand" href="../index.html" aria-label="Consultora Diagonales">
        <img class="brand-full" src="../assets/img/logo-completo.png" alt="Consultora Diagonales" data-logo />
        <img class="brand-mark" src="../assets/img/isotipo.png" alt="" aria-hidden="true" data-logo />
      </a>
      <nav class="desktop-nav" aria-label="Navegaci&oacute;n principal">
        <a href="../index.html" data-nav="inicio">Inicio</a>
        <a href="../servicios/index.html" data-nav="servicios">Servicios</a>
        <a href="../repositorio/index.html" data-nav="radiografias">Radiograf&iacute;as</a>
        <a href="../contacto/index.html" data-nav="contacto">Contacto</a>
        <a href="../admin/index.html" data-nav="admin">Admin</a>
      </nav>
      <button class="menu-toggle" type="button" aria-label="Abrir men&uacute;" aria-expanded="false" data-menu-toggle>
        <span></span>
        <span></span>
        <span></span>
      </button>
    </header>

    <div class="mobile-menu" data-mobile-menu aria-hidden="true">
      <a href="../index.html">Inicio</a>
      <a href="../servicios/index.html">Servicios</a>
      <a href="../repositorio/index.html">Radiograf&iacute;as</a>
      <a href="../contacto/index.html">Contacto</a>
      <a href="../admin/index.html">Admin</a>
    </div>

    <main class="subpage">
      <section class="registration-layout mx-auto grid min-h-screen max-w-7xl gap-10 px-6 pb-24 pt-36 md:px-10 lg:grid-cols-[.9fr_1.1fr] lg:px-12">
        <div>
          <p class="eyebrow">Acceso a radiograf&iacute;as</p>
          <h1 class="page-title">Eleg&iacute; c&oacute;mo quer&eacute;s recibir la radiograf&iacute;a.</h1>
          <p class="mt-6 max-w-xl text-base leading-8 text-slate-300">
            Pod&eacute;s recibirla por Email, por WhatsApp o por ambos. No es obligatorio dejar tu nombre.
          </p>
        </div>

        <form class="registration-form" data-registration-form style="position: relative;">
          <button
            type="button"
            data-registration-close
            aria-label="Cerrar y volver"
            style="position: absolute; top: 12px; right: 12px; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(139, 207, 241, 0.35); border-radius: 6px; background: rgba(139, 207, 241, 0.12); color: #dbf6ff; font-size: 20px; font-weight: 700; line-height: 1; cursor: pointer; transition: background 0.2s, border-color 0.2s; z-index: 5;"
            onmouseover="this.style.background='#C62828';this.style.borderColor='#C62828';this.style.color='#fff';"
            onmouseout="this.style.background='rgba(139,207,241,0.12)';this.style.borderColor='rgba(139,207,241,0.35)';this.style.color='#dbf6ff';"
          >&times;</button>

          <div class="grid gap-4 md:grid-cols-2" style="margin-top: 8px;">
            <label class="registration-channel" style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; border: 1px solid rgba(139,207,241,0.28); border-radius: 8px; cursor: pointer; font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase; font-size: 13px;">
              <input name="canal_email" type="checkbox" data-channel="email" style="width: 18px; height: 18px; accent-color: #009AFE;" />
              <span>Recibir por Email</span>
            </label>
            <label class="registration-channel" style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; border: 1px solid rgba(139,207,241,0.28); border-radius: 8px; cursor: pointer; font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase; font-size: 13px;">
              <input name="canal_whatsapp" type="checkbox" data-channel="whatsapp" style="width: 18px; height: 18px; accent-color: #009AFE;" />
              <span>Recibir por WhatsApp</span>
            </label>
          </div>

          <label data-field="email" hidden>
            <span>Correo electr&oacute;nico</span>
            <input name="email" type="email" autocomplete="email" placeholder="nombre@gmail.com" />
          </label>
          <label data-field="whatsapp" hidden>
            <span>WhatsApp / Celular</span>
            <input name="phone" type="tel" autocomplete="tel" placeholder="+54 9 ..." />
          </label>

          <div class="grid gap-5 md:grid-cols-2">
            <label>
              <span>Nombre (opcional)</span>
              <input name="full_name" type="text" autocomplete="name" placeholder="Tu nombre" />
            </label>
            <label>
              <span>Organizaci&oacute;n o rol (opcional)</span>
              <input name="organization" type="text" autocomplete="organization" placeholder="Consultora, medio, equipo..." />
            </label>
          </div>

          <label class="checkbox-field">
            <input name="terms" type="checkbox" required />
            <span>Acepto el uso de mis datos para gestionar mi acceso y comunicaciones de Consultora Diagonales.</span>
          </label>
          <button class="primary-link justify-center" type="submit" data-registration-submit>Solicitar radiograf&iacute;a</button>
          <p class="form-status" data-registration-status role="status"></p>
        </form>
      </section>
    </main>

    <footer class="site-footer">
      <span>&copy; CONSULTORA DIAGONALES | Data Analytics.</span>
    </footer>

    <script src="../assets/js/supabase-config.js?v=20260531-gmail-access"></script>
    <script src="../assets/js/main.js?v=20260722-audience-intelligence"></script>
    <script src="../assets/js/phone-access.js?v=20260703-phone-remote-required"></script>
    <script>
      // Mostrar el campo correspondiente al canal elegido (no excluyentes)
      document.querySelectorAll("[data-registration-form] [data-channel]").forEach((checkbox) => {
        checkbox.addEventListener("change", () => {
          const form = checkbox.closest("form");
          const field = form.querySelector(`[data-field="${checkbox.dataset.channel}"]`);
          if (!field) return;
          field.hidden = !checkbox.checked;
          const input = field.querySelector("input");
          if (input) {
            input.required = checkbox.checked;
            if (checkbox.checked) input.focus();
            else input.value = "";
          }
        });
      });

      document.querySelector("[data-registration-close]")?.addEventListener("click", () => {
        const params = new URLSearchParams(window.location.search);
        const next = params.get("next");
        if (next) {
          try {
            const url = new URL(next, window.location.origin);
            if (url.origin === window.location.origin) {
              // Limpiar parámetros de reporte privado para no re-disparar el flujo
              url.searchParams.delete("report");
              url.searchParams.delete("private_target");
              url.searchParams.delete("target");
              window.location.href = url.href;
              return;
            }
          } catch (_) {}
        }
        if (document.referrer) {
          try {
            if (new URL(document.referrer).origin === window.location.origin) {
              window.history.back();
              return;
            }
          } catch (_) {}
        }
        window.location.href = "../index.html";
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") document.querySelector("[data-registration-close]")?.click();
      });
    </script>
  </body>
</html>
