<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Radiografía | Consultora Diagonales</title>
    <link rel="stylesheet" href="../assets/css/style.css?v=20261020-report-view" />
    <style>
      html, body { height: 100%; }
      body { margin: 0; background: #080d14; }
      .report-view { display: flex; flex-direction: column; height: 100vh; }
      .report-view__bar { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: .85rem 1.1rem; border-bottom: 1px solid rgba(132,231,246,.28); background: #061a2a; }
      .report-view__bar div { min-width: 0; }
      .report-view__bar span { display: block; color: #8de9f6; font-size: .66rem; font-weight: 900; letter-spacing: .14em; text-transform: uppercase; }
      .report-view__bar h1 { display: -webkit-box; margin: .25rem 0 0; overflow: hidden; color: #fff; font-size: 1rem; font-weight: 800; line-height: 1.3; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
      .report-view__actions { display: flex; flex: none; gap: .5rem; }
      .report-view__actions a { display: inline-flex; align-items: center; min-height: 38px; padding: 0 .85rem; border: 1px solid rgba(181,243,250,.5); border-radius: 8px; color: #e8fcff; font-size: .68rem; font-weight: 900; letter-spacing: .06em; text-decoration: none; text-transform: uppercase; }
      .report-view__frame { flex: 1 1 auto; width: 100%; border: 0; background: #fff; }
      .report-view__state { display: grid; flex: 1 1 auto; place-items: center; padding: 2rem; color: #cfe9f3; text-align: center; line-height: 1.6; }
      .report-view__state p { max-width: 560px; margin: 0; }
    </style>
  </head>
  <body>
    <div class="report-view">
      <div class="report-view__bar">
        <div><span>Radiografía Diagonales</span><h1 data-report-title>Informe completo</h1></div>
        <div class="report-view__actions"><a href="../index.html">Inicio</a><a data-report-pdf hidden href="#" target="_blank" rel="noopener noreferrer">PDF</a></div>
      </div>
      <div class="report-view__state" data-report-state>Cargando el informe completo.</div>
      <iframe class="report-view__frame" data-report-frame hidden title="Informe completo"></iframe>
    </div>
    <script src="../assets/js/supabase-config.js?v=20261020-report-view"></script>
    <script src="../assets/js/report-html-view.js?v=20261020-report-view"></script>
    <script>
      (async function () {
        const params = new URLSearchParams(window.location.search);
        const reportId = params.get("report");
        const suppliedTitle = params.get("title");
        const state = document.querySelector("[data-report-state]");
        const frame = document.querySelector("[data-report-frame]");
        const title = document.querySelector("[data-report-title]");
        const pdfLink = document.querySelector("[data-report-pdf]");
        if (suppliedTitle) { title.textContent = suppliedTitle; document.title = `${suppliedTitle} | Consultora Diagonales`; }
        if (!reportId) { state.textContent = "No encontramos el informe solicitado."; return; }
        const config = window.CD_SUPABASE || {};
        try {
          const url = new URL("/rest/v1/radiografias", config.url);
          url.searchParams.set("id", `eq.${reportId}`);
          url.searchParams.set("select", "titulo,html_url,pdf_url");
          const response = await fetch(url, { headers: { apikey: config.anonKey, Authorization: `Bearer ${config.anonKey}` } });
          const rows = await response.json();
          const report = Array.isArray(rows) ? rows[0] : null;
          if (!response.ok || !report) throw new Error("Informe no disponible");
          if (report.titulo) { title.textContent = report.titulo; document.title = `${report.titulo} | Consultora Diagonales`; }
          const pdfHref = window.CDReportHtml.accessUrl(reportId, "pdf");
          pdfLink.href = pdfHref;
          pdfLink.hidden = false;
          if (!report.html_url) {
            state.innerHTML = "<p>Este informe está disponible en PDF. Los gráficos interactivos todavía no fueron cargados.</p>";
            return;
          }
          frame.src = await window.CDReportHtml.reportHtmlBlobUrl(reportId);
          frame.hidden = false;
          state.remove();
        } catch (_) {
          state.innerHTML = "<p>No se pudo abrir el informe en este momento. Usá el botón PDF para acceder al archivo.</p>";
        }
      })();
    </script>
  </body>
</html>
