<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Página no encontrada | Consultora Diagonales</title>
    <link rel="stylesheet" href="/assets/css/style.css?v=20260920-nota3" />
    <script>
      // Una nota publicada en el Admin puede no tener todavia su pagina estatica:
      // en ese caso la abrimos con el lector dinamico en vez de mostrar un 404.
      (function () {
        var match = window.location.pathname.match(/^\/noticias\/([^/]+)\.html$/);
        if (match && match[1] !== "nota" && match[1] !== "index") {
          window.location.replace("/noticias/nota.html?slug=" + encodeURIComponent(match[1]));
        }
      })();
    </script>
  </head>
  <body class="bg-[#080d14] text-white antialiased" data-page="404">
    <main class="subpage">
      <section class="mx-auto max-w-3xl px-6 pb-24 pt-40 text-center md:px-10">
        <p class="eyebrow">Error 404</p>
        <h1 class="mt-3 text-4xl font-black md:text-5xl">No encontramos esta página</h1>
        <p class="mx-auto mt-5 max-w-xl text-white/75">Puede que el enlace haya cambiado o que el contenido ya no esté disponible.</p>
        <p class="mt-8 flex flex-wrap justify-center gap-3">
          <a class="primary-link" href="/">Ir al inicio</a>
          <a class="secondary-link" href="/noticias/">Ver noticias</a>
          <a class="secondary-link" href="/repositorio/">Ver radiografías</a>
        </p>
      </section>
    </main>
  </body>
</html>
