<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Gestion de radiografias | Consultora Diagonales</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #071823;
        --panel: #062d3e;
        --line: rgba(139, 207, 241, 0.28);
        --blue: #82d8ff;
        --text: #f4fbff;
        --muted: rgba(226, 240, 248, 0.72);
        --danger: #ff8f8f;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--text);
        background: linear-gradient(180deg, rgba(34, 166, 194, 0.68), rgba(3, 30, 45, 0.96)),
          url("../assets/img/Fondo_Radigrafias_Registr_Contacto.png") center / cover fixed;
        font-family: Arial, Helvetica, sans-serif;
      }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        min-height: 74px;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        border-bottom: 1px solid rgba(139, 207, 241, 0.24);
        padding: 12px clamp(16px, 4vw, 42px);
        background: rgba(3, 20, 31, 0.88);
        backdrop-filter: blur(16px);
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        color: var(--text);
        font-size: 0.78rem;
        font-weight: 900;
        letter-spacing: 0.08em;
        text-decoration: none;
        text-transform: uppercase;
      }

      .brand img {
        width: 42px;
        height: 42px;
        object-fit: contain;
      }

      .topnav {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 8px;
      }

      .topnav a {
        border: 1px solid transparent;
        border-radius: 999px;
        padding: 0.62rem 0.82rem;
        color: rgba(244, 251, 255, 0.82);
        font-size: 0.7rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-decoration: none;
        text-transform: uppercase;
      }

      .topnav a:hover,
      .topnav a[aria-current="page"] {
        border-color: rgba(139, 207, 241, 0.34);
        color: var(--text);
        background: rgba(130, 216, 255, 0.1);
      }

      main {
        width: min(1120px, calc(100% - 32px));
        margin: 0 auto;
        padding: 48px 0;
      }

      h1,
      h2,
      h3,
      p {
        margin: 0;
      }

      h1 {
        max-width: 780px;
        font-size: clamp(2.2rem, 6vw, 4.4rem);
        line-height: 0.95;
        font-weight: 900;
      }

      .lead {
        max-width: 720px;
        margin-top: 18px;
        color: rgba(4, 22, 34, 0.9);
        font-size: 1rem;
        line-height: 1.7;
      }

      .grid {
        display: grid;
        grid-template-columns: minmax(300px, 0.78fr) minmax(520px, 1.22fr);
        gap: 24px;
        align-items: start;
        margin-top: 32px;
      }

      .panel {
        border: 1px solid var(--line);
        border-radius: 10px;
        background: rgba(5, 44, 62, 0.92);
        box-shadow: 0 24px 70px rgba(0, 14, 25, 0.22);
      }

      .panel-body {
        display: grid;
        gap: 16px;
        padding: 22px;
      }

      label {
        display: grid;
        gap: 8px;
        color: var(--blue);
        font-size: 0.72rem;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      input {
        width: 100%;
        min-height: 48px;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 0 14px;
        color: var(--text);
        background: rgba(3, 8, 13, 0.72);
        outline: none;
      }

      input[type="file"] {
        padding-top: 12px;
      }

      .checkbox-field {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        color: var(--muted);
        font-size: 0.9rem;
        font-weight: 700;
        letter-spacing: 0;
        line-height: 1.5;
        text-transform: none;
      }

      .checkbox-field input {
        width: 16px;
        min-height: 16px;
        margin-top: 3px;
        accent-color: var(--blue);
      }

      button,
      a.button {
        display: inline-flex;
        min-height: 40px;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(139, 207, 241, 0.36);
        border-radius: 999px;
        padding: 0.68rem 1rem;
        color: var(--text);
        background: rgba(2, 39, 64, 0.44);
        cursor: pointer;
        font-size: 0.72rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-decoration: none;
        text-transform: uppercase;
      }

      button:hover,
      a.button:hover {
        border-color: rgba(255, 255, 255, 0.48);
      }

      button.danger {
        border-color: rgba(255, 143, 143, 0.56);
        color: #ffdede;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .status {
        min-height: 22px;
        color: var(--muted);
        font-size: 0.92rem;
      }

      .list-status {
        min-height: 18px;
        padding: 0 22px 14px;
        color: var(--muted);
        font-size: 0.88rem;
        line-height: 1.4;
      }

      .list-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        border-bottom: 1px solid var(--line);
        padding: 18px 22px;
      }

      .list-head h2 {
        color: var(--blue);
        font-size: 0.8rem;
        font-weight: 900;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .report-list {
        display: grid;
        gap: 14px;
        padding: 18px 22px 22px;
      }

      .report-row {
        display: grid;
        grid-template-columns: 1fr;
        gap: 16px;
        align-items: start;
        border: 1px solid rgba(139, 207, 241, 0.18);
        border-radius: 8px;
        padding: 18px;
        background: rgba(3, 27, 45, 0.42);
      }

      .report-details {
        display: grid;
        gap: 8px;
        min-width: 0;
      }

      .report-title {
        color: var(--text);
        font-size: clamp(1.05rem, 1.6vw, 1.35rem);
        font-weight: 900;
        line-height: 1.22;
        overflow-wrap: anywhere;
      }

      .report-meta {
        display: grid;
        gap: 3px;
        color: var(--muted);
        font-size: 0.86rem;
        line-height: 1.5;
      }

      .report-meta div {
        overflow-wrap: anywhere;
      }

      .report-actions {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(138px, 1fr));
        gap: 10px;
      }

      .report-actions button,
      .report-actions a.button {
        width: 100%;
        min-width: 0;
        padding-inline: 0.82rem;
        text-align: center;
        white-space: nowrap;
      }

      .privacy-badge {
        display: inline-flex;
        width: fit-content;
        align-items: center;
        border: 1px solid rgba(139, 207, 241, 0.32);
        border-radius: 999px;
        margin-top: 8px;
        padding: 0.24rem 0.55rem;
        color: rgba(244, 251, 255, 0.88);
        background: rgba(130, 216, 255, 0.1);
        font-size: 0.68rem;
        font-weight: 900;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .privacy-badge.is-private {
        border-color: rgba(255, 211, 125, 0.46);
        color: #ffe7ad;
        background: rgba(130, 88, 2, 0.24);
      }

      .empty {
        padding: 18px 0;
        color: var(--muted);
      }

      .hidden {
        display: none !important;
      }

      @media (max-width: 860px) {
        .topbar {
          position: static;
          align-items: flex-start;
          flex-direction: column;
        }

        .topnav {
          justify-content: flex-start;
        }

        .grid,
        .report-row {
          grid-template-columns: 1fr;
        }

        .report-actions {
          grid-template-columns: 1fr;
        }

        .report-actions button,
        .report-actions a.button {
          white-space: normal;
        }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="../index.html" aria-label="Consultora Diagonales">
        <img src="../assets/img/isotipo.png" alt="" aria-hidden="true" />
        <span>Consultora Diagonales</span>
      </a>
      <nav class="topnav" aria-label="Navegacion principal">
        <a href="../index.html">Inicio</a>
        <a href="../servicios/index.html">Servicios</a>
        <a href="../repositorio/index.html">Radiografias</a>
        <a href="../contacto/index.html">Contacto</a>
        <a href="index.html" aria-current="page">Admin</a>
      </nav>
    </header>

    <main>
      <h1>Gestion de radiografias PDF.</h1>
      <p class="lead">
        Panel conectado a Supabase. Desde aca podes cargar un PDF, modificar datos, reemplazar el archivo o eliminar una radiografia.
      </p>

      <section class="grid">
        <form class="panel" data-form>
          <div class="panel-body">
            <input name="id" type="hidden" />
            <label>
              Titulo
              <input name="titulo" type="text" placeholder="Radiografia politica de..." required />
            </label>
            <label>
              Provincia
              <input name="provincia" type="text" placeholder="Buenos Aires" required />
            </label>
            <label>
              Localidad
              <input name="localidad" type="text" placeholder="La Plata" />
            </label>
            <label>
              Fecha
              <input name="fecha" type="date" required />
            </label>
            <label>
              Archivo PDF
              <input name="archivo" type="file" accept=".pdf,application/pdf" />
            </label>
            <label class="checkbox-field">
              <input name="is_private" type="checkbox" value="true" />
              <span>Privado: pedir registro de datos antes de abrir el PDF.</span>
            </label>
            <div class="actions">
              <button type="submit" data-submit>Guardar PDF</button>
              <button class="hidden" type="button" data-cancel>Cancelar modificacion</button>
            </div>
            <p class="status" data-status></p>
          </div>
        </form>

        <section class="panel">
          <div class="list-head">
            <h2>Radiografias cargadas</h2>
            <button type="button" data-refresh>Actualizar</button>
          </div>
          <div class="report-list" data-list>
            <p class="empty">Cargando radiografias...</p>
          </div>
          <p class="list-status" data-list-status role="status"></p>
        </section>
      </section>
    </main>

    <script src="../assets/js/supabase-config.js?v=admin-gestion"></script>
    <script>
      const SUPABASE_URL = window.CD_SUPABASE?.url || "";
      const SUPABASE_ANON_KEY = window.CD_SUPABASE?.anonKey || "";
      let ADMIN_KEY = sessionStorage.getItem("cd:admin_upload_key") || "";
      const endpoint = `${SUPABASE_URL}/functions/v1`;
      let reports = [];

      const form = document.querySelector("[data-form]");
      const list = document.querySelector("[data-list]");
      const status = document.querySelector("[data-status]");
      const listStatus = document.querySelector("[data-list-status]");
      const submit = document.querySelector("[data-submit]");
      const cancel = document.querySelector("[data-cancel]");

      if (!ADMIN_KEY) {
        ADMIN_KEY = prompt("Clave de administrador") || "";
        if (ADMIN_KEY) sessionStorage.setItem("cd:admin_upload_key", ADMIN_KEY);
      }

      function headers(extra = {}) {
        return {
          Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
          apikey: SUPABASE_ANON_KEY,
          "x-admin-key": ADMIN_KEY,
          ...extra,
        };
      }

      function escapeHtml(value) {
        return String(value || "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function setStatus(message) {
        status.textContent = message || "";
      }

      function setListStatus(message) {
        listStatus.textContent = message || "";
      }

      function resetForm() {
        form.reset();
        form.elements.id.value = "";
        submit.textContent = "Guardar PDF";
        cancel.classList.add("hidden");
        setStatus("");
      }

      function renderReports() {
        if (!reports.length) {
          list.innerHTML = '<p class="empty">Todavia no hay radiografias cargadas.</p>';
          return;
        }

        list.innerHTML = reports
          .map((report) => {
            const fileName = report.file_name ? `<div>Archivo: ${escapeHtml(report.file_name)}</div>` : "";
            const isPrivate = report.is_private === true || String(report.is_private || "").toLowerCase() === "true";
            const privacyLabel = isPrivate ? "Privado" : "Publico";
            const privacyButton = isPrivate ? "Hacer publico" : "Hacer privado";
            const pdf = report.pdf_url
              ? `<a class="button" href="${escapeHtml(report.pdf_url)}" target="_blank" rel="noopener">Abrir PDF</a>`
              : "";
            return `
              <article class="report-row">
                <div class="report-details">
                  <div class="report-title">${escapeHtml(report.titulo)}</div>
                  <span class="privacy-badge${isPrivate ? " is-private" : ""}">${privacyLabel}</span>
                  <div class="report-meta">
                    <div>${escapeHtml([report.localidad, report.provincia].filter(Boolean).join(", "))}</div>
                    <div>${escapeHtml(report.fecha || "")}</div>
                    ${fileName}
                  </div>
                </div>
                <div class="actions report-actions">
                  ${pdf}
                  <button type="button" data-privacy="${escapeHtml(report.id)}" data-private-next="${isPrivate ? "false" : "true"}">${privacyButton}</button>
                  <button type="button" data-edit="${escapeHtml(report.id)}">Modificar</button>
                  <button class="danger" type="button" data-delete="${escapeHtml(report.id)}">Eliminar</button>
                </div>
              </article>
            `;
          })
          .join("");
      }

      async function loadReports() {
        list.innerHTML = '<p class="empty">Cargando radiografias...</p>';
        setListStatus("");
        const response = await fetch(`${endpoint}/admin-dashboard?v=${Date.now()}`, {
          headers: headers(),
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.error || "No se pudo cargar el dashboard.");
        reports = data.reports || [];
        renderReports();
      }

      async function saveReport(event) {
        event.preventDefault();
        const id = form.elements.id.value.trim();
        const file = form.elements.archivo.files[0];
        if (!id && !file) {
          setStatus("Selecciona un PDF para cargar.");
          return;
        }

        const body = new FormData(form);
        body.set("is_private", form.elements.is_private.checked ? "true" : "false");
        if (!file) body.delete("archivo");

        submit.disabled = true;
        submit.textContent = id ? "Actualizando..." : "Guardando...";
        setStatus(id ? "Actualizando radiografia..." : "Subiendo PDF...");

        try {
          const response = await fetch(`${endpoint}/admin-upload-report`, {
            method: id ? "PATCH" : "POST",
            headers: headers(),
            body,
          });
          const data = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(data.error || "No se pudo guardar.");
          resetForm();
          setStatus(id ? "Radiografia modificada." : "Radiografia cargada.");
          await loadReports();
        } catch (error) {
          setStatus(error.message);
        } finally {
          submit.disabled = false;
          submit.textContent = form.elements.id.value ? "Actualizar radiografia" : "Guardar PDF";
        }
      }

      function editReport(id) {
        const report = reports.find((item) => item.id === id);
        if (!report) return;
        form.elements.id.value = report.id || "";
        form.elements.titulo.value = report.titulo || "";
        form.elements.provincia.value = report.provincia || "";
        form.elements.localidad.value = report.localidad || "";
        form.elements.fecha.value = report.fecha || "";
        form.elements.archivo.value = "";
        form.elements.is_private.checked = report.is_private === true || String(report.is_private || "").toLowerCase() === "true";
        submit.textContent = "Actualizar radiografia";
        cancel.classList.remove("hidden");
        setStatus("Modificando: cambia los datos o selecciona un PDF nuevo para reemplazar el actual.");
        form.scrollIntoView({ behavior: "smooth", block: "start" });
      }

      async function deleteReport(id) {
        const report = reports.find((item) => item.id === id);
        if (!report) return;
        if (!confirm(`Eliminar "${report.titulo}"?`)) return;
        setListStatus("Eliminando radiografia...");
        const response = await fetch(`${endpoint}/admin-upload-report?id=${encodeURIComponent(id)}`, {
          method: "DELETE",
          headers: headers({ "content-type": "application/json" }),
          body: JSON.stringify({ id }),
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
          setListStatus(data.error || "No se pudo eliminar.");
          return;
        }
        resetForm();
        await loadReports();
        setListStatus("Radiografia eliminada.");
      }

      async function setReportPrivacy(id, isPrivate, button) {
        const report = reports.find((item) => item.id === id);
        if (!report) {
          setListStatus("No se encontro la radiografia seleccionada.");
          return;
        }

        const body = new FormData();
        body.append("id", id);
        body.append("titulo", report.titulo || "");
        body.append("provincia", report.provincia || "");
        body.append("localidad", report.localidad || "");
        body.append("fecha", report.fecha || "");
        body.append("is_private", isPrivate ? "true" : "false");

        if (button) button.disabled = true;
        setListStatus(isPrivate ? "Cerrando acceso: la radiografia pedira registro." : "Abriendo acceso publico.");
        try {
          const response = await fetch(`${endpoint}/admin-upload-report`, {
            method: "PATCH",
            headers: headers(),
            body,
          });
          const data = await response.json().catch(() => ({}));
          if (!response.ok) {
            throw new Error(data.error || "No se pudo cambiar la privacidad.");
          }
          await loadReports();
          setListStatus(isPrivate ? "Radiografia privada: ahora pedira registro antes del PDF." : "Radiografia publica: ahora abre directo.");
        } finally {
          if (button) button.disabled = false;
        }
      }

      form.addEventListener("submit", saveReport);
      cancel.addEventListener("click", resetForm);
      document.querySelector("[data-refresh]").addEventListener("click", () => loadReports().catch((error) => setListStatus(error.message)));
      list.addEventListener("click", (event) => {
        const edit = event.target.closest("[data-edit]");
        const del = event.target.closest("[data-delete]");
        const privacy = event.target.closest("[data-privacy]");
        if (privacy) {
          event.preventDefault();
          event.stopPropagation();
          setReportPrivacy(privacy.dataset.privacy, privacy.dataset.privateNext === "true", privacy).catch((error) => setListStatus(error.message));
          return;
        }
        if (edit) {
          event.preventDefault();
          editReport(edit.dataset.edit);
          return;
        }
        if (del) {
          event.preventDefault();
          deleteReport(del.dataset.delete);
        }
      });

      loadReports().catch((error) => {
        list.innerHTML = `<p class="empty">${escapeHtml(error.message)}</p>`;
      });
    </script>
  </body>
</html>
